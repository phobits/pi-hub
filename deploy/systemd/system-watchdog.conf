# Installed by scripts/install-pi.sh to /etc/systemd/system.conf.d/
# Ticket #1: hardware watchdog. systemd pets /dev/watchdog; if PID 1 itself
# wedges (kernel hang, total memory starvation) the SoC reboots after 15 s.
# Needs `dtparam=watchdog=on` in config.txt — the installer adds it.
[Manager]
RuntimeWatchdogSec=15
RebootWatchdogSec=2min
